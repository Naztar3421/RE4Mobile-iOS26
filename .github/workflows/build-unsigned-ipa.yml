name: Build unsigned iOS preview IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Validate four synthetic MCT formats byte-for-byte
        run: bash tools/validate-synthetic-mct.sh
      - name: Validate Mach-O parser and segment mapper
        run: bash tools/validate-mach-o32.sh
      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project RE4MCTPreview.xcodeproj \
            -scheme RE4MCTPreview \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild.log
      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/RE4MCTPreview.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && /usr/bin/zip -qry RE4MCTPreview-unsigned.ipa Payload)
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RE4MCTPreview-unsigned-ipa
          path: |
            build/RE4MCTPreview-unsigned.ipa
            xcodebuild.log
          if-no-files-found: warn
          retention-days: 14
